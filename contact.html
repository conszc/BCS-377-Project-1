    <main>
        <section class="contact-info">
            <h2>Get in Touch</h2>
            <p>If you have any questions or would like to collaborate, feel free to reach out!</p>
            <ul>
                <li>Email: <a href="mailto:zephanconstantine@gmail.com">zephanconstantine@gmail.com</a></li>
            </ul>

            <form id="contactForm" action="https://formspree.io/f/your-form-id" method="POST">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="_replyto" required>

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <button type="submit">Send</button>
        </section>
